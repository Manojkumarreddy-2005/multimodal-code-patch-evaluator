    <rect x="14" y="14" width="540" height="412" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="284" y="38" text-anchor="middle" fill="#162A4A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700">
      (a) PatchRankingEnv MDP &amp; Dueling Double-DQN Architecture
    </text>

    <!-- Candidate Inputs -->
    <rect x="28" y="56" width="128" height="44" rx="6" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.3"/>
    <text x="92" y="74" text-anchor="middle" fill="#162A4A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700">Candidate Slot 1 (x₁)</text>
    <text x="92" y="90" text-anchor="middle" fill="#475569" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9">f₁ ∈ ℝ⁶⁴ (Multimodal)</text>

    <rect x="172" y="56" width="128" height="44" rx="6" fill="#FFFFFF" stroke="#0CA678" stroke-width="1.3"/>
    <text x="236" y="74" text-anchor="middle" fill="#087F5B" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700">Candidate Slot 2 (x₂)</text>
    <text x="236" y="90" text-anchor="middle" fill="#475569" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9">f₂ ∈ ℝ⁶⁴ (Randomized)</text>

    <!-- Interaction State -->
    <line x1="92" y1="100" x2="140" y2="122" stroke="#3B5BDB" stroke-width="1.4" marker-end="url(#arrowIndigo)"/>
    <line x1="236" y1="100" x2="188" y2="122" stroke="#0CA678" stroke-width="1.4" marker-end="url(#arrowTeal)"/>

    <rect x="28" y="125" width="272" height="40" rx="6" fill="#EDF2FF" stroke="#3B5BDB" stroke-width="1.4"/>
    <text x="164" y="142" text-anchor="middle" fill="#162A4A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="700">Symmetric Interaction State sₜ ∈ ℝ²⁵⁶</text>
    <text x="164" y="157" text-anchor="middle" fill="#3B5BDB" font-family="'Consolas', 'Courier New', monospace" font-size="9.5">sₜ = [ f₁ ; f₂ ; f₁ − f₂ ; f₁ ⊙ f₂ ]</text>

    <!-- Shared Backbone -->
    <line x1="164" y1="165" x2="164" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="52" y="187" width="224" height="32" rx="6" fill="url(#gradNavy)"/>
    <text x="164" y="207" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="700">Shared Encoder: Linear(256→128) + GELU</text>

    <!-- Dueling Split -->
    <line x1="114" y1="219" x2="94" y2="241" stroke="#3B5BDB" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
    <line x1="214" y1="219" x2="234" y2="241" stroke="#E67700" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="28" y="244" width="124" height="46" rx="6" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.4"/>
    <text x="90" y="263" text-anchor="middle" fill="#3B5BDB" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700">Value Stream</text>
    <text x="90" y="279" text-anchor="middle" fill="#475569" font-family="'Consolas', 'Courier New', monospace" font-size="9.5">V(sₜ) ∈ ℝ¹</text>

    <rect x="176" y="244" width="124" height="46" rx="6" fill="#FFFFFF" stroke="#E67700" stroke-width="1.4"/>
    <text x="238" y="263" text-anchor="middle" fill="#D9480F" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700">Advantage Stream</text>
    <text x="238" y="279" text-anchor="middle" fill="#475569" font-family="'Consolas', 'Courier New', monospace" font-size="9.5">A(sₜ, a) ∈ ℝ²</text>

    <!-- Aggregation -->
    <line x1="90" y1="290" x2="140" y2="312" stroke="#3B5BDB" stroke-width="1.4" marker-end="url(#arrowIndigo)"/>
    <line x1="238" y1="290" x2="188" y2="312" stroke="#E67700" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="28" y="315" width="272" height="40" rx="6" fill="url(#gradTeal)"/>
    <text x="164" y="332" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700">Dueling Aggregation &amp; Action Selection</text>
    <text x="164" y="347" text-anchor="middle" fill="#E6FCF5" font-family="'Consolas', 'Courier New', monospace" font-size="9.4">Q(s,a) = V(s) + (A(s,a) − mean A) → a*∈{0,1}</text>

    <!-- Replay & Target Network (Right side of Left Panel) -->
    <rect x="318" y="56" width="222" height="148" rx="7" fill="#FFF9DB" stroke="#E67700" stroke-width="1.3"/>
    <text x="429" y="75" text-anchor="middle" fill="#D9480F" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700">Multi-Objective Reward R(sₜ, aₜ)</text>
    <text x="328" y="95" fill="#0F172A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600">1. Pass Guarantee (w=1.00):</text>
    <text x="336" y="109" fill="#475569" font-family="'Consolas', 'Courier New', monospace" font-size="9">r_pass = 1.0 · I[pass(aₜ)]</text>
    <text x="328" y="126" fill="#0F172A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600">2. Debt Reduction (w=2.00):</text>
    <text x="336" y="140" fill="#475569" font-family="'Consolas', 'Courier New', monospace" font-size="9">r_debt = 2.0·tanh(ΔTDI / 25)</text>
    <text x="328" y="157" fill="#0F172A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600">3. Complexity Risk (w=0.75):</text>
    <text x="336" y="171" fill="#475569" font-family="'Consolas', 'Courier New', monospace" font-size="9">r_comp = 0.75·tanh(Δ_cog,nest)</text>
    <text x="328" y="188" fill="#0F172A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600">4. Clone/DRY Penalty (w=0.75):</text>
    <text x="336" y="200" fill="#475569" font-family="'Consolas', 'Courier New', monospace" font-size="9">r_dup  = 0.75·tanh(Δ_clone,4g)</text>

    <rect x="318" y="218" width="222" height="137" rx="7" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
    <text x="429" y="237" text-anchor="middle" fill="#162A4A" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700">Double-DQN Stabilization</text>
    <text x="328" y="256" fill="#475569" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Experience Replay: 8,192 transitions</text>
    <text x="328" y="273" fill="#475569" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Target Decoupling (Double-DQN):</text>
    <text x="334" y="288" fill="#3B5BDB" font-family="'Consolas', 'Courier New', monospace" font-size="8.8">y = r + γ Q_tgt(s′, argmax Q_on)</text>
    <text x="328" y="305" fill="#475569" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Smooth-L1 Huber TD Loss (|δ|≤2)</text>
    <text x="328" y="322" fill="#475569" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Polyak Target Update (τ = 0.08)</text>
    <text x="328" y="339" fill="#475569" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5">• ε-Greedy Decay: 0.35 → 0.03 (γ=0.9)</text>

    <!-- Bottom summary strip -->
